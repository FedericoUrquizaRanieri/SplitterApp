version: '3.8'

services:
  # Database Service
  db:
    image: postgres:16-alpine
    container_name: splitter_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: splitter_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  # Web (Next.js) Service
  web:
    build:
      context: .
      dockerfile: ../docker/dev.Dockerfile
    container_name: splitter_web
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:postgres_password@db:5432/splitter_db?schema=public
      - NODE_ENV=development
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - db
    networks:
      - app-network

  # Nginx Reverse Proxy Service
  nginx:
    image: nginx:1.25-alpine
    container_name: splitter_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ../docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
