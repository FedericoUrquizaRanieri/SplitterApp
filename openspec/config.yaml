schema: spec-driven

# Project context
# This is shown to AI when creating artifacts.
context: |
  Dominio: app de finanzas personales (ingresos/egresos, cuentas, categorías,
  presupuestos, análisis, dashboard) más grupos para dividir gastos entre personas.
  Monousuario, sin autenticación en esta fase.
  Proyecto activo: `finance-app/` (a crear), Kotlin Multiplatform con UI compartida
  en Compose Multiplatform para Android, iOS y Desktop. Módulos: `shared`,
  `composeApp` y `backend` (Ktor Server, JVM).
  Stack: Kotlin, Compose Multiplatform, SQLDelight (local-first), Ktor Client/Server,
  coroutines/Flow, kotlinx-serialization, Koin. Gráficos propios con Canvas.
  Convenciones: montos en centavos (Long), ids UUID generados en el cliente,
  `updated_at` + `deleted_at` (borrado lógico) en toda entidad sincronizable,
  sincronización last-write-wins por `updated_at`. MVVM con flujo unidireccional.
  Lógica de dominio testeable en JVM.
  `splitter-app/` (Next.js) es legado/obsoleto: no se modifica ni se usa como referencia.
  Idioma de specs y documentación: español.

